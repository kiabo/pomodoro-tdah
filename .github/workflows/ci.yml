name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7 \
            xvfb dbus-x11 desktop-file-utils fakeroot
      - name: Testes de lógica
        run: python3 -m unittest discover -s tests -t .
      - name: Testes de interface (Xvfb)
        run: xvfb-run -a dbus-run-session -- python3 -m unittest discover -s tests_gtk -t .
        env:
          GDK_BACKEND: x11
      - name: Valida o .desktop
        run: desktop-file-validate packaging/pomodoro-tdah.desktop
      - name: Gera o .deb
        run: scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
